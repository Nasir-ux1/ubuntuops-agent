[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntuops-agent"
version = "0.1.0"
description = "AI-assisted Ubuntu incident response and diagnostics toolkit."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9",
  "rich>=13.0",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ubuntuops = "ubuntuops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
